[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "nethacked-gym"
version = "0.3.0"
description = "NetHack reimplementation in Rust - Gymnasium RL Environment"
readme = "README.md"
authors = [{ name = "Dmytro Yemelianov (Emelyanov)" }]
license = { text = "NGPL" }
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
]

[tool.maturin]
manifest-path = "../crates/nethacked-py/Cargo.toml"
module-name = "nethacked_py"
features = ["pyo3/extension-module"]
