[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "netrust-gym"
version = "0.1.0"
description = "NetHack reimplementation in Rust - Gymnasium RL Environment"
readme = "README.md"
authors = [{ name = "NetRust Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "gymnasium>=0.29.0",
]

[project.optional-dependencies]
rl = [
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
]

[tool.maturin]
manifest-path = "../crates/netrust-py/Cargo.toml"
module-name = "netrust_py"
features = ["pyo3/extension-module"]
