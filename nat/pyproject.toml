[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "nethacked-nat"
version = "0.3.0"
authors = [{ name = "Dmytro Yemelianov (Emelyanov)" }]
description = "NVIDIA NeMo Agent Toolkit (NAT) configuration and tools for NetHackED review and development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nvidia-nat[langchain]~=1.9.0",
]

[project.entry-points.'nat.components']
nethacked_nat = "nethacked_nat.register"
