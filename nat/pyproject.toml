[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "netrust-nat"
version = "0.2.0"
description = "NVIDIA NeMo Agent Toolkit (NAT) configuration and tools for NetRust review and development"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nvidia-nat[langchain]~=1.9.0",
]

[project.entry-points.'nat.components']
netrust_nat = "netrust_nat.register"
