# SPDX-License-Identifier: Apache-2.0
# NeMo Agent Toolkit (NAT) Configuration for NetHackED Review & Development

general:
  telemetry:
    tracing:
      file_trace:
        _type: file
        output_path: .nat/traces/
        project: nethacked-rule-packs

llms:
  nim_llm:
    _type: openai
    model_name: meta/llama-3.2-90b-vision-instruct
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.1
    max_tokens: 4096

functions:
  nethacked_workspace_reader:
    _type: nethacked_workspace_reader
    max_read_lines: 500

  nethacked_cargo_runner:
    _type: nethacked_cargo_runner
    timeout_seconds: 300

  nethacked_golden_verifier:
    _type: nethacked_golden_verifier
    timeout_seconds: 180

  nethacked_rulepacks_auditor:
    _type: nethacked_rulepacks_auditor

workflow:
  _type: react_agent
  llm_name: nim_llm
  tool_names:
    - nethacked_workspace_reader
    - nethacked_cargo_runner
    - nethacked_golden_verifier
    - nethacked_rulepacks_auditor
  max_tool_calls: 10
  retry_agent_response_parsing_errors: true
  use_native_tool_calling: true
  additional_instructions: |
    You are an expert NetHackED Systems Architect and Game Engine Specialist assisting with the NetHackED codebase and the Rule Packs P1 implementation.

    The repository consists of:
    1. NetHackED Engine crates: nethacked-core, nethacked-types, nethacked-data, nethacked-sim, nethacked-agent, nethacked-dungeon, nethacked-tui, nethacked-wasm, nethacked-py.
    2. Formal Verification: Lean 4 proofs (lake build).
    3. Rule Packs P1: Architectural overhaul moving game data to Arc<Ruleset> while ensuring bit-for-bit vanilla determinism preservation (Task 1 golden determinism tests).

    Your role is to:
    - Review and audit code changes against global constraints and the plan in docs/superpowers/plans/2026-10-04-rule-packs-p1.md.
    - Run toolchain gates (cargo fmt, cargo clippy, cargo test, cargo build -p nethacked-wasm, lake build) using nethacked_cargo_runner.
    - Always verify golden determinism using nethacked_golden_verifier.
    - Verify WASM hygiene and absence of forbidden dependencies using nethacked_rulepacks_auditor.
