# SPDX-License-Identifier: Apache-2.0
# NeMo Agent Toolkit (NAT) Configuration for NetHackED using OpenAI backend

general:
  telemetry:
    tracing:
      file_trace:
        _type: file
        output_path: .nat/traces/
        project: nethacked-rule-packs-openai

llms:
  openai_llm:
    _type: openai
    model_name: gpt-4o
    api_key: ${OPENAI_API_KEY}
    temperature: 0.1
    max_tokens: 4096

functions:
  nethacked_workspace_reader:
    _type: nethacked_workspace_reader
    max_read_lines: 500

  nethacked_cargo_runner:
    _type: nethacked_cargo_runner
    timeout_seconds: 300

  nethacked_golden_verifier:
    _type: nethacked_golden_verifier
    timeout_seconds: 180

  nethacked_rulepacks_auditor:
    _type: nethacked_rulepacks_auditor

workflow:
  _type: react_agent
  llm_name: openai_llm
  tool_names:
    - nethacked_workspace_reader
    - nethacked_cargo_runner
    - nethacked_golden_verifier
    - nethacked_rulepacks_auditor
  max_tool_calls: 10
  retry_agent_response_parsing_errors: true
  use_native_tool_calling: true
