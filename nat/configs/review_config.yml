# SPDX-License-Identifier: Apache-2.0
# NeMo Agent Toolkit (NAT) Configuration for NetHackED Architectural & Review Workflows

general:
  telemetry:
    tracing:
      file_trace:
        _type: file
        output_path: .nat/traces/
        project: nethacked-rule-packs-review

llms:
  nim_llm:
    _type: openai
    model_name: meta/llama-3.2-90b-vision-instruct
    base_url: https://integrate.api.nvidia.com/v1
    api_key: ${NVIDIA_API_KEY}
    temperature: 0.05
    max_tokens: 2048

functions:
  nethacked_workspace_reader:
    _type: nethacked_workspace_reader
    max_read_lines: 100

  nethacked_cargo_runner:
    _type: nethacked_cargo_runner
    timeout_seconds: 300

  nethacked_golden_verifier:
    _type: nethacked_golden_verifier
    timeout_seconds: 180

  nethacked_rulepacks_auditor:
    _type: nethacked_rulepacks_auditor

workflow:
  _type: react_agent
  llm_name: nim_llm
  tool_names:
    - nethacked_workspace_reader
    - nethacked_cargo_runner
    - nethacked_golden_verifier
    - nethacked_rulepacks_auditor
  max_tool_calls: 10
  retry_agent_response_parsing_errors: true
  use_native_tool_calling: true
  additional_instructions: |
    You are a meticulous NetHackED Code Reviewer and Architectural Auditor.
    Focus on:
    - Invariant preservation: Golden determinism must stay bit-for-bit identical to vanilla.
    - WASM boundary cleanliness: no toml, clap, schemars in the wasm dependency graph.
    - Deterministic ordering: No HashMap/HashSet iteration influencing game state.
    - Canonical JSON formatting and schema validation rules.
