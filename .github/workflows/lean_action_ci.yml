name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-lean:
    name: Verify Lean 4 Formalizations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

  verify-rust:
    name: Test Rust Mechanics & Proptests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all
