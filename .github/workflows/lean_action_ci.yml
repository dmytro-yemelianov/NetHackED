name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify-lean:
    name: Verify Lean 4 Formalizations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude nethacked-py --locked
      - name: Validate, build and simulate example rule pack
        run: |
          cargo run -p nethacked-pack --locked -- validate packs/examples/hard-mode
          cargo run -p nethacked-pack --locked -- build packs/examples/hard-mode -o hard-mode.nhpack
          cargo run -p nethacked-pack --locked -- validate hard-mode.nhpack
          cargo run -p nethacked-pack --locked -- simulate hard-mode.nhpack --seeds 2 --turns 200
          rm hard-mode.nhpack

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p nethacked-wasm --target wasm32-unknown-unknown --locked

  docs:
    name: doc links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-doc-links.sh
      - run: bash scripts/check-no-static-tables.sh
      - run: python3 scripts/parity-summary.py --check
