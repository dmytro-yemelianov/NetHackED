<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NetHackED — from Yemelianov (Emelyanov Dmytro)</title>
  <meta name="nethacked-base" content="../">
  <meta name="nethacked-build" content="dev">
  <meta name="description" content="NetHackED: classic NetHack reimplemented in Rust, running as WebAssembly in your browser.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='14' font-family='monospace' fill='%23fff'>@</text></svg>">
  <style>
    :root { color-scheme: dark; --bg: #05070a; --fg: #c0c0c0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    body { display: grid; place-items: center; background: radial-gradient(circle at center, #0f141c 0%, #05070a 100%); }
    /* Pixel renderer (same look as yemelianov.dev): a 4:3 canvas, crisp pixels. */
    canvas#screen {
      display: none;
      width: min(100vw, calc(100dvh * 4 / 3));
      height: min(100dvh, calc(100vw * 3 / 4));
      aspect-ratio: 4 / 3;
      border-radius: 4px;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.9);
      image-rendering: pixelated;
    }
    body.pixel canvas#screen { display: block; }
    /* With the canvas active the text terminal stays in the DOM for screen readers. */
    body.pixel #term {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); clip-path: inset(50%); white-space: pre;
    }
    #term {
      margin: 0;
      font: 16px/1.15 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
      color: var(--fg);
      white-space: pre;
      outline: none;
      transform-origin: center;
    }
    .c-hero { color: #fff; font-weight: 700; }
    .c-mon { color: #ff5555; }
    .c-pet { color: #ffffff; }
    .c-gold { color: #f1fa8c; }
    .c-item { color: #8be9fd; }
    .c-stair { color: #fff; }
    .c-door { color: #b8860b; }
    .c-wall { color: #9a9a9a; }
    .c-dim { color: #555; }
    .c-water { color: #4a7dff; }
    .c-hl { color: #fff; }
    .c-bad { color: #ff5555; }
    .project-links {
      position: fixed;
      top: max(0.5rem, env(safe-area-inset-top));
      right: max(0.5rem, env(safe-area-inset-right));
      display: flex;
      gap: 0.4rem;
      z-index: 1;
      font: 0.75rem/1 ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace;
    }
    .project-links a {
      padding: 0.45rem 0.55rem;
      color: #c0c0c0;
      background: rgba(5, 7, 10, 0.9);
      border: 1px solid #596273;
      border-radius: 3px;
      text-decoration: none;
    }
    .project-links a:hover, .project-links a:focus-visible {
      color: #fff;
      border-color: #fff;
      outline: none;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="1280" height="800" aria-hidden="true"></canvas>
  <pre id="term" tabindex="0" aria-label="NetHackED terminal">Loading NetHackED…</pre>
  <nav class="project-links" aria-label="Project links">
    <a href="https://yemelianov.dev/">Portfolio</a>
    <a href="https://github.com/dmytro-yemelianov/NetHackED">Source</a>
  </nav>
  <script type="module" src="play.js"></script>
</body>
</html>
