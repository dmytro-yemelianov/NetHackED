[package]
name = "netrust-py"
license = "NGPL"
version = "0.3.0"
edition = "2021"
description = "PyO3 Python Gym / RL Environment bindings for NetRust"

[lib]
name = "netrust_py"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"] }
netrust-types = { path = "../netrust-types" }
netrust-arena = { path = "../netrust-arena" }
netrust-core = { path = "../netrust-core" }
netrust-sim = { path = "../netrust-sim" }
netrust-agent = { path = "../netrust-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
