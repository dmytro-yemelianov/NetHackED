[package]
name = "nethacked-agent"
license = "NGPL"
version = "0.3.0"
authors = ["Dmytro Yemelianov (Emelyanov)"]
edition = "2021"
description = "Agent interfaces for NetHackED: Model Context Protocol (MCP) server, JSON-RPC, and structured LLM observations"

[dependencies]
nethacked-types = { path = "../nethacked-types" }
nethacked-arena = { path = "../nethacked-arena" }
nethacked-core = { path = "../nethacked-core" }
nethacked-dungeon = { path = "../nethacked-dungeon" }
nethacked-sim = { path = "../nethacked-sim" }
nethacked-data = { path = "../nethacked-data" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
axum = "0.7"
async-graphql = "=7.0.2"
async-graphql-axum = "=7.0.2"
async-graphql-derive = "=7.0.2"
async-graphql-parser = "=7.0.2"
async-graphql-value = "=7.0.2"

[[bin]]
name = "nethacked-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "nethacked-jsonrpc"
path = "src/bin/jsonrpc.rs"

[[bin]]
name = "nethacked-graphql"
path = "src/bin/graphql.rs"

[[bin]]
name = "nethacked-benchmark"
path = "src/bin/benchmark.rs"

[[bin]]
name = "nethacked-demo"
path = "src/bin/demo.rs"

[[bin]]
name = "nethacked-bones-server"
path = "src/bin/bones_server.rs"


