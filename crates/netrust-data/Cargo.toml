[package]
name = "netrust-data"
license = "NGPL"
version = "0.3.0"
edition = "2021"
description = "Declarative data tables, bestiary, and item catalog for NetRust"

[dependencies]
netrust-types = { path = "../netrust-types" }
netrust-core = { path = "../netrust-core" }
netrust-arena = { path = "../netrust-arena" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", optional = true }

[features]
default = []
schema = ["dep:schemars", "netrust-types/schema", "netrust-core/schema"]
