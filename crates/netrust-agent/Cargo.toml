[package]
name = "netrust-agent"
version = "0.1.0"
edition = "2021"
description = "Agent interfaces for NetRust: Model Context Protocol (MCP) server, JSON-RPC, and structured LLM observations"

[dependencies]
netrust-types = { path = "../netrust-types" }
netrust-arena = { path = "../netrust-arena" }
netrust-core = { path = "../netrust-core" }
netrust-dungeon = { path = "../netrust-dungeon" }
netrust-sim = { path = "../netrust-sim" }
netrust-data = { path = "../netrust-data" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_chacha = "0.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
axum = "0.7"
async-graphql = "=7.0.2"
async-graphql-axum = "=7.0.2"
async-graphql-derive = "=7.0.2"
async-graphql-parser = "=7.0.2"
async-graphql-value = "=7.0.2"

[[bin]]
name = "netrust-mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "netrust-jsonrpc"
path = "src/bin/jsonrpc.rs"

[[bin]]
name = "netrust-graphql"
path = "src/bin/graphql.rs"

[[bin]]
name = "netrust-benchmark"
path = "src/bin/benchmark.rs"

