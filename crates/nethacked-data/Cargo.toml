[package]
name = "nethacked-data"
license = "NGPL"
version = "0.3.0"
authors = ["Dmytro Yemelianov (Emelyanov)"]
edition = "2021"
description = "Declarative data tables, bestiary, and item catalog for NetHackED"

[dependencies]
nethacked-types = { path = "../nethacked-types" }
nethacked-core = { path = "../nethacked-core" }
nethacked-arena = { path = "../nethacked-arena" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = { version = "0.8", optional = true }
rand = "0.9"

[features]
default = []
schema = ["dep:schemars", "nethacked-types/schema", "nethacked-core/schema"]
