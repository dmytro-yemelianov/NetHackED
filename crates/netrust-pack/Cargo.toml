[package]
name = "netrust-pack"
license = "NGPL"
version = "0.2.0"
edition = "2021"
description = "Rule pack library, parser, patch merger, validator, and pack format for NetRust"

[dependencies]
netrust-types = { path = "../netrust-types" }
netrust-core = { path = "../netrust-core" }
netrust-data = { path = "../netrust-data" }
netrust-sim = { path = "../netrust-sim" }
netrust-agent = { path = "../netrust-agent" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
schemars = { version = "0.8", optional = true }

[dev-dependencies]
proptest = "1.5"

[features]
default = ["schema"]
schema = ["dep:schemars", "netrust-data/schema", "netrust-types/schema"]

[[bin]]
name = "netrust-pack"
path = "src/main.rs"
