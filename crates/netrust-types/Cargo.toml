[package]
name = "netrust-types"
license = "NGPL"
version = "0.3.0"
edition = "2021"
description = "Fundamental domain types, coordinates, and enums for NetRust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
slotmap = { version = "1.1.1", features = ["serde"] }
schemars = { version = "0.8", optional = true }

[features]
default = []
schema = ["dep:schemars"]

[dev-dependencies]
proptest = "1.5"
serde_json = "1.0"
