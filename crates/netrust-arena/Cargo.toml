[package]
name = "netrust-arena"
license = "NGPL"
version = "0.1.0"
edition = "2021"
description = "Generational arena entity storage replacing intrusive pointers for NetRust"

[dependencies]
netrust-types = { path = "../netrust-types" }
slotmap = { version = "1.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
proptest = "1.5"
