[package]
name = "netrust-dungeon"
license = "NGPL"
version = "0.1.0"
edition = "2021"
description = "Grid map representation, FOV shadowcasting, and procedural level generation for NetRust"

[dependencies]
netrust-types = { path = "../netrust-types" }
netrust-core = { path = "../netrust-core" }
serde = { version = "1.0", features = ["derive"] }
rand = "0.9"

[dev-dependencies]
proptest = "1.5"
rand_chacha = "0.9"
