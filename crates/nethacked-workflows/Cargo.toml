[package]
name = "nethacked-workflows"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "NGPL"
description = "Optional authoritative bounded module workflows"

[features]
default = []
persistence = []

[dependencies]
nethacked-kernel = { path = "../nethacked-kernel" }
nethacked-resources = { path = "../nethacked-resources" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
wat = "=1.228.0"
