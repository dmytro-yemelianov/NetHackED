[package]
name = "nethacked-timers"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "NGPL"
description = "Optional bounded once-admitted callback timer queue"

[dependencies]
nethacked-kernel = { path = "../nethacked-kernel" }
nethacked-resources = { path = "../nethacked-resources" }
nethacked-workflows = { path = "../nethacked-workflows" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
nethacked-inputs = { path = "../nethacked-inputs" }
wat = "=1.228.0"
