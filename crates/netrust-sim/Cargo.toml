[package]
name = "netrust-sim"
license = "NGPL"
version = "0.2.0"
edition = "2021"
description = "Deterministic simulation engine, replay logger, and event processor for NetRust"

[dependencies]
netrust-types = { path = "../netrust-types" }
netrust-arena = { path = "../netrust-arena" }
netrust-dungeon = { path = "../netrust-dungeon" }
netrust-core = { path = "../netrust-core" }
netrust-data = { path = "../netrust-data" }
netrust-i18n = { path = "../netrust-i18n" }
rand = "0.9"
rand_chacha = { version = "0.9", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
proptest = "1.5"


