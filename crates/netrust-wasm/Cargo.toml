[package]
name = "netrust-wasm"
license = "NGPL"
version = "0.1.0"
edition = "2021"
description = "WebAssembly (WASM) browser bindings and runner for NetRust"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
netrust-types = { path = "../netrust-types" }
netrust-arena = { path = "../netrust-arena" }
netrust-data = { path = "../netrust-data" }
netrust-core = { path = "../netrust-core" }
netrust-dungeon = { path = "../netrust-dungeon" }
netrust-sim = { path = "../netrust-sim" }
netrust-agent = { path = "../netrust-agent" }
netrust-i18n = { path = "../netrust-i18n" }
wasm-bindgen = "0.2.129"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

