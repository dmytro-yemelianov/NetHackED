[package]
name = "nethacked-inputs"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "NGPL"
description = "Optional bounded recorded input over authenticated operations"

[dependencies]
nethacked-kernel = { path = "../nethacked-kernel" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
nethacked-workflows = { path = "../nethacked-workflows" }
nethacked-resources = { path = "../nethacked-resources" }
wat = "=1.228.0"
